<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🦋 shaka player — pop-out</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:linear-gradient(160deg,#171126,#0d0a14);color:#f3ead8;font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
  .pill{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,rgba(240,180,41,.16),rgba(23,17,38,.92));border:1px solid #f0b429;border-radius:999px;padding:12px 22px 12px 14px;box-shadow:0 8px 40px rgba(240,180,41,.25)}
  button.play{width:52px;height:52px;border-radius:50%;border:none;background:#f0b429;color:#241a02;font-size:1.3rem;cursor:pointer;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,.5)}50%{box-shadow:0 0 0 12px rgba(240,180,41,0)}}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .bars{display:inline-flex;gap:2.5px;align-items:flex-end;height:14px;margin-right:2px}
  .bars i{width:3px;background:#f0b429;border-radius:2px;animation:eq .9s ease-in-out infinite}
  .bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
  #status{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#ffd97a}
  #sub{font-size:.82rem;color:#b9a8cf}
  #trackbtn{width:32px;height:32px;border-radius:50%;border:1px solid #f0b429;background:transparent;color:#ffd97a;font-size:.75rem;cursor:pointer}
  #progress{width:100%;max-width:340px;height:6px;border-radius:3px;background:rgba(240,180,41,.15);cursor:pointer;position:relative}
  #bar{height:100%;border-radius:3px;background:#f0b429;width:0%}
  #time{font-size:.75rem;color:#b9a8cf;font-variant-numeric:tabular-nums}
  a.lyrics{color:#2dd4bf;font-size:.85rem;text-decoration:none;border:1px solid rgba(45,212,191,.4);border-radius:999px;padding:6px 14px}
  a.lyrics:hover{background:rgba(45,212,191,.12)}
  .note{font-size:.72rem;color:#6f6390;text-align:center;max-width:300px;line-height:1.5}
</style>
</head>
<body>
<div class="pill">
  <button class="play" id="btn">▶</button>
  <div style="line-height:1.35">
    <div id="status">loading…</div>
    <div id="sub"></div>
  </div>
  <button id="trackbtn" title="switch track">1·2</button>
</div>
<div id="progress"><div id="bar"></div></div>
<div id="time">0:00 / 0:00</div>
<a class="lyrics" href="https://shakaleikaumaka.com/" target="_blank" rel="noopener">🦋 lyrics & sing-along →</a>
<p class="note">This little window is the jukebox 🎵<br>Browse every dashboard in your main window — the music lives here and never stops.</p>
<audio id="song" preload="auto"></audio>
<script>
const TRACKS = [
  { title: 'Butterflies and Love', sub: 'demo recorded with Ethereum Singapore for Aya Miyaguchi 🦋',
    src: 'https://shaka-anthem-gzdk4epeah-ffieyo32.taur.link/assets/i-open-sourced-my-whole-universe.mp3' },
  { title: 'A Planet We Share As One', sub: 'recorded with Ethereum Singapore 🌍',
    src: 'https://shaka-anthem-gzdk4epeah-ffieyo32.taur.link/assets/a-planet-we-share-as-one.mp3' }
];
const song = document.getElementById('song');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const sub = document.getElementById('sub');
const trackBtn = document.getElementById('trackbtn');
const bar = document.getElementById('bar');
const time = document.getElementById('time');
const q = new URLSearchParams(location.search);
let ti = Math.min(Math.max(parseInt(q.get('bl_trk') || '0', 10) || 0, 0), TRACKS.length - 1);
let playing = false;
function fmt(t){ if (!isFinite(t)) t = 0; const m = Math.floor(t/60), s = Math.floor(t%60); return m + ':' + String(s).padStart(2,'0'); }
function setTrack(i){
  ti = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length;
  song.src = TRACKS[ti].src;
  sub.textContent = TRACKS[ti].sub;
  trackBtn.textContent = (ti + 1) + '·' + TRACKS.length;
  trackBtn.title = 'switch track — next: ' + TRACKS[(ti + 1) % TRACKS.length].title;
  document.title = (playing ? '▶ ' : '🦋 ') + TRACKS[ti].title + ' — shaka player';
}
function setPlaying(on){
  playing = on;
  btn.textContent = on ? '❚❚' : '▶';
  btn.style.animation = on ? 'none' : 'pulse 2s infinite';
  status.innerHTML = on ? '<span class="bars"><i></i><i></i><i></i></span> now playing — ' + TRACKS[ti].title : 'paused — ' + TRACKS[ti].title;
  document.title = (on ? '▶ ' : '🦋 ') + TRACKS[ti].title + ' — shaka player';
}
btn.addEventListener('click', () => {
  if (playing) { song.pause(); setPlaying(false); }
  else song.play().then(() => setPlaying(true)).catch(() => {});
});
trackBtn.addEventListener('click', () => {
  const was = playing;
  setTrack(ti + 1);
  if (was) song.play().then(() => setPlaying(true)).catch(() => {});
  else setPlaying(false);
});
song.addEventListener('ended', () => { setTrack(ti + 1); song.play().then(() => setPlaying(true)).catch(() => setPlaying(false)); });
song.addEventListener('timeupdate', () => {
  if (song.duration) bar.style.width = (song.currentTime / song.duration * 100) + '%';
  time.textContent = fmt(song.currentTime) + ' / ' + fmt(song.duration);
});
document.getElementById('progress').addEventListener('click', (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  if (song.duration) song.currentTime = ((e.clientX - r.left) / r.width) * song.duration;
});
// resume from the page that popped us out
setTrack(ti);
const startT = parseFloat(q.get('bl_t') || '0');
if (startT > 1) { song.addEventListener('loadedmetadata', () => { try { song.currentTime = startT; } catch(e){} }, { once: true }); }
setPlaying(false);
song.play().then(() => setPlaying(true)).catch(() => { status.textContent = 'tap ▶ to start — ' + TRACKS[ti].title; });
</script>
</body>
</html>
